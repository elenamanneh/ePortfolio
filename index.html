<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" type="image/svg+xml" href="/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elena Manneh's ePortfolio</title>
    <link rel="stylesheet" href="/styles.css" />

  <body>
    <div id="app">
        <div class="note">
          <p id="contact-link">
            Contact Me
          </p>
          <p id="move-note" style="display: none; margin:0; line-height:1;">

      </div>
      <canvas id=game></canvas>
